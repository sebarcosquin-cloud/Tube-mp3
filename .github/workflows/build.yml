name: Build APK
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir zip
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -1)
          echo "ZIP: $ZIP"
          rm -rf _src
          mkdir _src
          unzip -q -o "$ZIP" -d _src
          ROOT=$(find _src -type f -name "settings.gradle.kts" | head -1 | xargs dirname)
          echo "ROOT: $ROOT"
          cp -r $ROOT/. .
          ls -la
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Compilar APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Tube-mp3-apk
          path: app/build/outputs/apk/debug/app-debug.apk
