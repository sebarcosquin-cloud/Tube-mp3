name: build
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir zip
        run: |
          ZIP=$(ls -1 *.zip | head -1)
          rm -rf _src
          mkdir _src
          unzip -q -o "$ZIP" -d _src
          ROOT=$(find _src -type d -name "app" | head -1 | xargs dirname)
          echo "Proyecto en: $ROOT"
          cp -rf $ROOT/. .
          chmod +x ./gradlew 2>/dev/null || true
          ls -la
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Compilar APK
        run: |
          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i "s|distributionUrl.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-bin.zip|" gradle/wrapper/gradle-wrapper.properties
            cat gradle/wrapper/gradle-wrapper.properties
          fi
          if [ -f "./gradlew" ]; then
            ./gradlew --no-daemon assembleDebug
          else
            gradle wrapper --gradle-version 9.3.1
            ./gradlew --no-daemon assembleDebug
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Tube-mp3-apk
          path: app/build/outputs/apk/debug/app-debug.apk
