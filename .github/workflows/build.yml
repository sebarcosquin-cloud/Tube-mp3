name: Build APK
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir zip
        run: |
          ZIP=$(find . -name "*.zip" | head -1)
          unzip -o "$ZIP"
          rm "$ZIP"
          for d in tubemp3* */; do
            if [ -f "$d/build.gradle.kts" ] || [ -f "$d/app/build.gradle" ] || [ -f "$d/app/build.gradle.kts" ]; then
              mv "$d"/* . 2>/dev/null || true
              break
            fi
          done
          ls -la
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Tube-mp3-apk
          path: app/build/outputs/apk/debug/app-debug.apk
