name: build
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir zip
        run: |
          ZIP=$(ls -1 *.zip | head -1)
          rm -rf _src
          mkdir _src
          unzip -q -o "$ZIP" -d _src
          # busca donde esta la app
          ROOT=$(find _src -type d -name "app" | head -1 | xargs dirname)
          echo "Proyecto en: $ROOT"
          ls "$ROOT"
          # copia TODO lo del proyecto a la raiz
          cp -rf $ROOT/. .
          chmod +x ./gradlew 2>/dev/null || echo "no habia gradlew, lo creamos"
          ls -la
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Compilar APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew --no-daemon assembleDebug
          else
            echo "Creando gradlew..."
            gradle wrapper --gradle-version 8.5
            ./gradlew --no-daemon assembleDebug
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Tube-mp3-apk
          path: app/build/outputs/apk/debug/app-debug.apk
