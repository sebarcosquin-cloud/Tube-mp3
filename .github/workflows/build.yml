name: Build APK
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir
        run: |
          ZIP=$(find . -name "*.zip" | head -1)
          rm -rf _src
          mkdir _src
          unzip -o "$ZIP" -d _src
          ROOT=$(find _src -type d -name "app" | head -1 | xargs dirname)
          cp -r "$ROOT"/. .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Compilar APK
        run: |
          ls -la app
          gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Tube-mp3-apk
          path: app/build/outputs/apk/debug/app-debug.apk
